<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Web Radar</title>
<style>
:root {
    --bg: #0d0d0d;
    --panel: #161618;
    --border: #2a2a2e;
    --text: #e0e0e0;
    --dim: #888;
    --ct: #5ea8db;
    --t: #dba55e;
    --bomb: #e63946;
    --accent: #7c5cbf;
    --dead: #444;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
header h1 { font-size: 14px; font-weight: 600; letter-spacing: 1px; }
.status { font-size: 12px; padding: 3px 10px; border-radius: 10px; }
.status.ok { background: #1a3a1a; color: #5cb85c; }
.status.err { background: #3a1a1a; color: #d9534f; }

.main { display: flex; flex: 1; overflow: hidden; }

.sidebar {
    width: 200px; background: var(--panel); border-right: 1px solid var(--border);
    padding: 10px; overflow-y: auto; flex-shrink: 0;
}
.sidebar h3 { font-size: 11px; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
.player-card {
    padding: 4px 6px; margin-bottom: 3px; border-radius: 3px;
    font-size: 11px; display: flex; align-items: center; gap: 6px;
}
.player-card .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.player-card .hp { margin-left: auto; color: var(--dim); font-size: 10px; }
.player-card.dead { opacity: 0.4; text-decoration: line-through; }

.radar-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
}
canvas { image-rendering: auto; }

.map-select {
    position: absolute; top: 10px; left: 10px; z-index: 10;
}
.map-select select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 4px 8px; border-radius: 3px; font-size: 12px; cursor: pointer;
}
.info {
    position: absolute; bottom: 10px; left: 10px; font-size: 10px; color: var(--dim);
}
</style>
</head>
<body>

<header>
    <h1>CS2 RADAR</h1>
    <span id="status" class="status err">Disconnected</span>
</header>

<div class="main">
    <div class="sidebar">
        <h3 style="color: var(--ct);">Counter-Terrorists</h3>
        <div id="ct-list"></div>
        <h3 style="color: var(--t); margin-top: 12px;">Terrorists</h3>
        <div id="t-list"></div>
    </div>

    <div class="radar-wrap">
        <div class="map-select">
            <select id="map-dropdown"></select>
        </div>
        <canvas id="radar"></canvas>
        <div class="info" id="info">Waiting for data...</div>
    </div>
</div>

<script>
// ---- Map data (pos_x, pos_y, scale) for coordinate transforms ----
const MAPS = {
    'de_dust2':   { x: -2476, y: 3239,  scale: 4.4,  label: 'Dust 2' },
    'de_mirage':  { x: -3230, y: 1713,  scale: 5.0,  label: 'Mirage' },
    'de_inferno': { x: -2087, y: 3870,  scale: 4.9,  label: 'Inferno' },
    'de_nuke':    { x: -3453, y: 2887,  scale: 7.0,  label: 'Nuke' },
    'de_overpass':{ x: -4831, y: 1781,  scale: 5.2,  label: 'Overpass' },
    'de_ancient': { x: -2953, y: 2164,  scale: 5.0,  label: 'Ancient' },
    'de_anubis':  { x: -2796, y: 3328,  scale: 5.22, label: 'Anubis' },
    'de_vertigo': { x: -3168, y: 1762,  scale: 4.0,  label: 'Vertigo' },
    'de_train':   { x: -2477, y: 2392,  scale: 4.7,  label: 'Train' },
    'cs_office':  { x: -1838, y: 1858,  scale: 4.1,  label: 'Office' },
    'cs_italy':   { x: -2647, y: 2592,  scale: 4.6,  label: 'Italy' },
    'de_mills':   { x: -3072, y: 2816,  scale: 5.5,  label: 'Mills' },
    'de_thera':   { x: -2700, y: 3100,  scale: 5.0,  label: 'Thera' },
};

// Radar image URLs (community-hosted radar overviews)
const MAP_IMAGE_BASE = 'https://raw.githubusercontent.com/AkeelMedina22/Counter-Strike-2-Radar-Maps/main/radar/';

// ---- State ----
let currentMap = null;
let mapImage = null;
let mapImageLoaded = false;
let gameData = null;
let ws = null;
let reconnectTimer = null;

// ---- Canvas setup ----
const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');
const RADAR_SIZE = 1024;

function resizeCanvas() {
    const wrap = document.querySelector('.radar-wrap');
    const side = Math.min(wrap.clientWidth, wrap.clientHeight) - 20;
    canvas.width = side;
    canvas.height = side;
    canvas.style.width = side + 'px';
    canvas.style.height = side + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ---- Map dropdown ----
const dropdown = document.getElementById('map-dropdown');
const autoOpt = document.createElement('option');
autoOpt.value = 'auto';
autoOpt.textContent = 'Auto-detect';
dropdown.appendChild(autoOpt);

for (const [key, val] of Object.entries(MAPS)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = val.label;
    dropdown.appendChild(opt);
}

dropdown.addEventListener('change', () => {
    if (dropdown.value !== 'auto') {
        setMap(dropdown.value);
    }
});

function setMap(name) {
    if (currentMap === name) return;
    currentMap = name;
    mapImageLoaded = false;
    mapImage = new Image();
    mapImage.crossOrigin = 'anonymous';
    mapImage.onload = () => { mapImageLoaded = true; };
    mapImage.onerror = () => { mapImageLoaded = false; };

    // Try loading the radar image
    mapImage.src = MAP_IMAGE_BASE + name + '/' + name + '_radar.png';
}

// ---- Coordinate transform: world → canvas pixel ----
function worldToCanvas(worldX, worldY) {
    if (!currentMap || !MAPS[currentMap]) return { x: 0, y: 0 };
    const m = MAPS[currentMap];
    const size = canvas.width;
    const rx = (worldX - m.x) / (m.scale * RADAR_SIZE) * size;
    const ry = (m.y - worldY) / (m.scale * RADAR_SIZE) * size;
    return { x: rx, y: ry };
}

// ---- Draw ----
function draw() {
    requestAnimationFrame(draw);

    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Background
    if (mapImageLoaded && mapImage) {
        ctx.globalAlpha = 0.85;
        ctx.drawImage(mapImage, 0, 0, w, h);
        ctx.globalAlpha = 1.0;
    } else {
        // Grid fallback
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 1;
        const step = w / 16;
        for (let i = 0; i <= 16; i++) {
            ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * step); ctx.lineTo(w, i * step); ctx.stroke();
        }
    }

    if (!gameData || !currentMap) return;

    const dotSize = Math.max(6, w / 80);

    // Draw players
    for (const p of gameData.p) {
        const pos = worldToCanvas(p.x, p.y);
        if (pos.x < -50 || pos.x > w + 50 || pos.y < -50 || pos.y > h + 50) continue;

        const isCT = p.t === 3;
        const isDead = p.d;
        const color = isDead ? '#444' : (isCT ? '#5ea8db' : '#dba55e');

        ctx.globalAlpha = isDead ? 0.35 : 1.0;

        // Direction indicator (triangle)
        if (!isDead) {
            const angle = (-p.a + 90) * Math.PI / 180;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(angle);

            // Pointed triangle
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, -dotSize * 1.3);
            ctx.lineTo(-dotSize * 0.6, dotSize * 0.5);
            ctx.lineTo(dotSize * 0.6, dotSize * 0.5);
            ctx.closePath();
            ctx.fill();

            // Outline
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();
        } else {
            // Dead = X
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            const s = dotSize * 0.5;
            ctx.beginPath();
            ctx.moveTo(pos.x - s, pos.y - s);
            ctx.lineTo(pos.x + s, pos.y + s);
            ctx.moveTo(pos.x + s, pos.y - s);
            ctx.lineTo(pos.x - s, pos.y + s);
            ctx.stroke();
        }

        // Name + health label
        if (!isDead) {
            ctx.fillStyle = '#fff';
            ctx.font = `${Math.max(9, w / 100)}px 'Segoe UI', sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(p.n, pos.x, pos.y + dotSize + 12);

            // Health bar
            const barW = dotSize * 2;
            const barH = 2;
            const barY = pos.y + dotSize + 14;
            ctx.fillStyle = '#333';
            ctx.fillRect(pos.x - barW/2, barY, barW, barH);
            const hpFrac = Math.max(0, Math.min(1, p.h / 100));
            const hpColor = hpFrac > 0.5 ? '#5cb85c' : (hpFrac > 0.25 ? '#f0ad4e' : '#d9534f');
            ctx.fillStyle = hpColor;
            ctx.fillRect(pos.x - barW/2, barY, barW * hpFrac, barH);
        }

        ctx.globalAlpha = 1.0;
    }

    // Local player indicator
    if (gameData.lp) {
        const lp = worldToCanvas(gameData.lp.x, gameData.lp.y);
        const angle = (-gameData.va + 90) * Math.PI / 180;

        ctx.save();
        ctx.translate(lp.x, lp.y);
        ctx.rotate(angle);

        // Green arrow for local
        ctx.fillStyle = '#5cb85c';
        ctx.beginPath();
        ctx.moveTo(0, -dotSize * 1.5);
        ctx.lineTo(-dotSize * 0.7, dotSize * 0.6);
        ctx.lineTo(dotSize * 0.7, dotSize * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();

        // "YOU" label
        ctx.fillStyle = '#5cb85c';
        ctx.font = `bold ${Math.max(10, w / 90)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('YOU', lp.x, lp.y + dotSize + 14);
    }
}

// ---- Player list sidebar ----
function updateSidebar() {
    const ctList = document.getElementById('ct-list');
    const tList = document.getElementById('t-list');
    ctList.innerHTML = '';
    tList.innerHTML = '';

    if (!gameData) return;

    for (const p of gameData.p) {
        const card = document.createElement('div');
        card.className = 'player-card' + (p.d ? ' dead' : '');
        const isCT = p.t === 3;

        card.innerHTML = `
            <span class="dot" style="background:${isCT ? 'var(--ct)' : 'var(--t)'}"></span>
            <span>${escHtml(p.n)}</span>
            <span class="hp">${p.d ? 'DEAD' : p.h + ' HP'}</span>
        `;

        if (isCT) ctList.appendChild(card);
        else tList.appendChild(card);
    }
}

function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- WebSocket connection ----
// Supports three URL modes:
//   ?ws=wss://abc.ngrok-free.app   (ngrok / custom relay — best for internet)
//   ?ip=192.168.1.5&port=22006     (direct LAN connection)
//   (no params)                     → localhost:22006

function buildWsUrl() {
    const params = new URLSearchParams(window.location.search);

    // Mode 1: full websocket URL (ngrok, tunnels, custom relays)
    const wsParam = params.get('ws');
    if (wsParam) return wsParam;

    // Mode 2: ip + port
    const ip   = params.get('ip') || 'localhost';
    const port = parseInt(params.get('port')) || 22006;
    return `ws://${ip}:${port}`;
}

let wsUrl = buildWsUrl();

function connect() {
    const statusEl = document.getElementById('status');
    const infoEl = document.getElementById('info');

    statusEl.textContent = 'Connecting...';
    statusEl.className = 'status err';
    infoEl.textContent = `Connecting to ${wsUrl}...`;

    try {
        ws = new WebSocket(wsUrl);
    } catch (e) {
        statusEl.textContent = 'Connection failed';
        scheduleReconnect();
        return;
    }

    ws.onopen = () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'status ok';
        infoEl.textContent = `Live — ${wsUrl}`;
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };

    ws.onmessage = (event) => {
        try {
            gameData = JSON.parse(event.data);

            // Auto-detect map
            if (gameData.m && dropdown.value === 'auto') {
                const mapKey = gameData.m.replace('maps/', '').replace('.vpk', '');
                if (MAPS[mapKey] && currentMap !== mapKey) {
                    setMap(mapKey);
                }
            }

            updateSidebar();
        } catch (e) {}
    };

    ws.onclose = () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'status err';
        scheduleReconnect();
    };

    ws.onerror = () => {};
}

function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect();
    }, 3000);
}

// ---- Init ----
connect();
draw();
</script>
</body>
</html>
